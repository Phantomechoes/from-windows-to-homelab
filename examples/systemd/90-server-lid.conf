# Drop-in for systemd-logind.
# Installed path on xin-server:
# /etc/systemd/logind.conf.d/90-server-lid.conf
#
# The lid-close test that was actually performed: external power attached,
# lid shut, SSH from the Mac over Tailscale still worked.
# HandleLidSwitch and HandleLidSwitchDocked are set as well. A battery-only
# lid test was not recorded.

[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
